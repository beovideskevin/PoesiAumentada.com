<!doctype html>
<html>
    <head>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
        <title>Poesia Aumentada | Poemas de Luis Manuel Pimentel</title>
        <script
            crossorigin="anonymous"
            src="./external/scripts/8frame-1.5.0.min.js"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
            async
            crossorigin="anonymous"
            data-preload-chunks="slam"
        ></script>
        <!-- <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
            crossorigin="anonymous"
        ></script> -->
        <!-- <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
            crossorigin="anonymous"
        ></script> -->
        <script
            src="./external/xrextras/xrextras.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <script src="bundle.js"></script>
        <!-- <script src="stop-video-on-target-lost.js"></script> -->
        <a-scene
            xrextras-loading
            xrextras-runtime-error
            renderer="colorManagement:true"
            xrweb="disableWorldTracking: true"
        >
            <a-assets>
                <!-- poemas cortos -->
                <img
                    id="pimentel-corto-1-thumb"
                    src="assets/images/thumbs/pimentel-corto-1-play.png"
                />
                <video
                    id="pimentel-corto-1-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    loading="eager"
                    preload="auto"
                    src="assets/videos/pimentel-corto-1-sm.mp4#t=0.001"
                ></video>

                <img
                    id="pimentel-corto-2-thumb"
                    src="assets/images/thumbs/pimentel-corto-2-play.png"
                />
                <video
                    id="pimentel-corto-2-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    loading="eager"
                    preload="auto"
                    src="assets/videos/pimentel-corto-2-sm.mp4#t=0.001"
                ></video>

                <img
                    id="pimentel-corto-3-thumb"
                    src="assets/images/thumbs/pimentel-corto-3-play.png"
                />
                <video
                    id="pimentel-corto-3-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    loading="eager"
                    preload="auto"
                    src="assets/videos/pimentel-corto-3-sm.mp4#t=0.001"
                ></video>

                <img
                    id="pimentel-corto-4-thumb"
                    src="assets/images/thumbs/pimentel-corto-4-play.png"
                />
                <video
                    id="pimentel-corto-4-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    loading="eager"
                    preload="auto"
                    src="assets/videos/pimentel-corto-4-sm.mp4#t=0.001"
                ></video>

                <img
                    id="pimentel-corto-5-thumb"
                    src="assets/images/thumbs/pimentel-corto-5-play.png"
                />
                <video
                    id="pimentel-corto-5-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    loading="eager"
                    preload="auto"
                    src="assets/videos/pimentel-corto-5-sm.mp4#t=0.001"
                ></video>
            </a-assets>

            <a-camera
                id="camera"
                position="0 0 0"
                raycaster="objects: .cantap"
                cursor="fuse: false; rayOrigin: mouse;"
            >
            </a-camera>

            <a-light
                type="directional"
                intensity="0.5"
                position="1 1 1"
            ></a-light>

            <a-light type="ambient" intensity="1"></a-light>
            <!-- poemas cortos -->
            <xrextras-named-image-target
                name="pimentel-corto-1"
                id="pimentel-corto-1"
            >
                <a-entity 
                    id="pimentel-1-video-element"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-1-video;" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="pimentel-1-thumb-element"
                    class="cantap"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-1-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target
                name="pimentel-corto-2"
                id="pimentel-corto-2"
            >
                <a-entity 
                    id="pimentel-2-video-element"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-2-video;" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="pimentel-2-thumb-element"
                    class="cantap"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-2-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target
                name="pimentel-corto-3"
                target-video-stop-on-lost="video: #pimentel-corto-3-video; thumb: #pimentel-corto-3-thumb"
            >
                <a-entity 
                    id="pimentel-3-video-element"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-3-video;" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="pimentel-3-thumb-element"
                    class="cantap"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-3-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target
                name="pimentel-corto-4"
                id="pimentel-corto-4"
            >
                <a-entity 
                    id="pimentel-4-video-element"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-4-video;" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="pimentel-4-thumb-element"
                    class="cantap"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-4-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target
                name="pimentel-corto-5"
                id="pimentel-corto-5"
            >
                <a-entity 
                    id="pimentel-5-video-element"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-5-video;" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="pimentel-5-thumb-element"
                    class="cantap"
                    geometry="primitive: plane; height: 1; width: 1;"
                    material="shader: flat; src: #pimentel-5-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>
        </a-scene>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const targets = [
                    {
                        id: 'pimentel-1',
                        video: 'pimentel-1-video',
                        videoPlane: 'pimentel-1-video-element',
                        thumbPlane: 'pimentel-1-thumb-element',
                    },
                    {
                        id: 'pimentel-2',
                        video: 'pimentel-2-video',
                        videoPlane: 'pimentel-2-video-element',
                        thumbPlane: 'pimentel-2-thumb-element',
                    },
                    {
                        id: 'pimentel-3',
                        video: 'pimentel-3-video',
                        videoPlane: 'pimentel-3-video-element',
                        thumbPlane: 'pimentel-3-thumb-element',
                    },
                    {
                        id: 'pimentel-4',
                        video: 'pimentel-4-video',
                        videoPlane: 'pimentel-4-video-element',
                        thumbPlane: 'pimentel-4-thumb-element',
                    },
                    {
                        id: 'pimentel-5',
                        video: 'pimentel-5-video',
                        videoPlane: 'pimentel-5-video-element',
                        thumbPlane: 'pimentel-5-thumb-element',
                    },
                ];

                const cameraEl = document.getElementById("camera");

                targets.forEach(({ id, video: videoId, videoPlane: videoPlaneId, thumbPlane: thumbPlaneId, name: qName, quote: qQuote }) => {
                    const target = document.getElementById(id);
                    const videoPlane = document.getElementById(videoPlaneId);
                    const thumbPlane = document.getElementById(thumbPlaneId);
                    const video = document.getElementById(videoId);

                    if (!target || !video || !videoPlane || !thumbPlane) {
                        console.error(`Missing video target elements for ${id}`);
                        return;
                    }

                    const toggleEl = ({thumb, video}) => {
                        thumbPlane.setAttribute('visible', thumb);
                        videoPlane.setAttribute('visible', video);

                        thumbPlane.classList.toggle('cantap', thumb);
                        cameraEl.components.raycaster.refreshObjects();
                    }

                    const handleClick = () => {
                        video.play().then(() => {
                            toggleEl({thumb: false, video: true});
                            const shaderMaterial = videoPlane.components.material.material;
                            if (shaderMaterial && shaderMaterial.uniforms && shaderMaterial.uniforms.myTexture) {
                                shaderMaterial.uniforms.myTexture.value.needsUpdate = true;
                            }
                        }).catch((error) => {
                            if (revealVideoOnPlaying === revealVideo) {
                                video.removeEventListener('playing', revealVideo);
                            }
                            console.error('Unable to play video:', error);
                        });
                    }

                    thumbPlane.addEventListener('click', handleClick);

                    target.addEventListener('xrextrasfound', () => {
                        toggleEl({thumb: true, video: false});
                    });

                    target.addEventListener('xrextraslost', () => {
                        toggleEl({thumb: false, video: false});
                        if (!video.paused) {
                            video.pause();
                            video.currentTime = 0;
                        }
                    });

                    video.addEventListener('ended', () => {
                        toggleEl({thumb: true, video: false});
                        video.currentTime = 0;
                    });
                });
            });
        </script>
    </body>
</html>
